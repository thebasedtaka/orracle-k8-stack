image:
  repository: jellyfin/jellyfin
  pullPolicy: IfNotPresent
  tag: "12.0-rc5"

persistence:
  enabled: true

  config:
    accessMode: ReadWriteOnce
    size: 800Mi

  cache:
    accessMode: ReadWriteOnce
    size: 10Gi
  
  additionalVolumes:
    - name: media
      persistentVolumeClaim:
        claimName: media-storage
  
  additionalMounts:
    - name: media
      mountPath: /data

service:
  type: ClusterIP
  port: 8096

ingress:
  enabled: false