# Default values for jellyfin.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

image:
  repository: jellyfin/jellyfin
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

persistence:
  enabled: true
  config:
    existingClaim: ""
    accessMode: ReadWriteOnce
    size: 800Mi
    storageClassName: ""
  cache:
    existingClaim: ""
    accessMode: ReadWriteOnce
    size: 10Gi
    storageClassName: ""
  additionalVolumes: []
  additionalMounts: []

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

deployment:
  # -- Deployment strategy
  strategy:
    type: RollingUpdate

podSecurityContext:
  {}
  # fsGroup: 2000

securityContext:
  {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 8096
  # -- Optional external ip (i.e. if you want to reach the service directly from your lan)
  externalIPs: []

ingress:
  enabled: false
  className: ""
  annotations:
    {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# -- environment values
env:
  # -- simple key: val based env vars
  simple: {}
  #    foo: bar
  # -- full envs, they will be rendered as written here. Useful if you need to use secrets/cm
  full: []
#    - name: xxx
#      valueFrom:
#        configMapKeyRef:
#          key: "my-config"
#          name: "secret"
#          optional: false

annotations:
  # -- Deployment's annotations
  deployment: {}

