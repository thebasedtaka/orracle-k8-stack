name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Add Alekc Helm repo
        run: helm repo add alekc-charts https://charts.alekc.dev/

      - name: Update Helm repos
        run: helm repo update

      - name: Prepare chart directory
        run: mkdir -p /tmp/charts

      - name: Lint qBittorrent
        run: |
          helm pull alekc-charts/qbittorrent --version 2.7.5 --untar --untardir /tmp/charts
          helm lint /tmp/charts/qbittorrent -f helm/qbittorrent/values.yaml

      - name: Lint Sonarr
        run: |
          helm pull alekc-charts/sonarr --version 1.8.7 --untar --untardir /tmp/charts
          helm lint /tmp/charts/sonarr -f helm/sonarr/values.yaml

      - name: Lint Radarr
        run: |
          helm pull alekc-charts/radarr --version 2.3.0 --untar --untardir /tmp/charts
          helm lint /tmp/charts/radarr -f helm/radarr/values.yaml

      - name: Lint Prowlarr
        run: |
          helm pull alekc-charts/prowlarr --version 2.4.0 --untar --untardir /tmp/charts
          helm lint /tmp/charts/prowlarr -f helm/prowlarr/values.yaml

      - name: Lint Jellyfin
        run: |
          helm pull alekc-charts/jellyfin --version 0.8.11 --untar --untardir /tmp/charts
          helm lint /tmp/charts/jellyfin -f helm/jellyfin/values.yaml

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check -recursive
      
      - name: Terraform Init
        working-directory: terraform
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate