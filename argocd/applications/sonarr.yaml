apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sonarr
  namespace: argocd
spec:
  project: default

  sources:
    - repoURL: https://charts.alekc.dev/
      chart: sonarr
      targetRevision: 1.8.7
      helm:
        valueFiles:
          - $values/helm/sonarr/values.yaml

    - repoURL: https://github.com/thebasedtaka/orracle-k8-stack.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: media

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true